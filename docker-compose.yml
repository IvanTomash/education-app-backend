services:
    postgres:
        image: postgres:15
        container_name: postgresdb
        environment:
            POSTGRES_DB: educationappdb
            POSTGRES_USER: myuser
            POSTGRES_PASSWORD: mypassword
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - mynetwork
    
    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: pgadmin
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@myapp.com
            PGADMIN_DEFAULT_PASSWORD: adminpassword
        ports:
            - "8080:80"
        networks:
            - mynetwork
        depends_on:
            - postgres

    redis:
        image: redis:7
        container_name: redis
        ports:
            - "6379:6379"
        networks:
            - mynetwork

volumes:
 pgdata:

networks:
 mynetwork:
